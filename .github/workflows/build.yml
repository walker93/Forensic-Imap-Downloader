name: Build and test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ForensicIMAPDownloader.slnx

      - name: Build
        run: dotnet build ForensicIMAPDownloader.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ForensicIMAPDownloader.Tests/ForensicIMAPDownloader.Tests.vbproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ForensicIMAPDownloader.Tests/TestResults/test-results.trx
